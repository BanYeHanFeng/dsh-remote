name: 发布

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 发布类型
        type: choice
        options:
          - prerelease
          - release
        default: prerelease

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建（${{ matrix.arch }}）
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 格式检查
        if: matrix.arch == 'x86_64'
        run: cargo fmt --all --check

      - name: Clippy 检查
        if: matrix.arch == 'x86_64'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 打包
        run: |
          BIN="target/${{ matrix.target }}/release/dsh-remote"
          desc=$(file -b "$BIN")
          echo "$desc"
          case "$desc" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *) echo "产物不是静态链接" >&2; exit 1 ;;
          esac
          tar --zstd -cf "dsh-remote-linux-${{ matrix.arch }}.tar.zst" -C "$(dirname "$BIN")" dsh-remote

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-linux-${{ matrix.arch }}
          path: dsh-remote-linux-${{ matrix.arch }}.tar.zst
          if-no-files-found: error

  publish:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 计算校验和
        run: cd dist && sha256sum ./*.tar.zst > SHA256SUMS

      - name: 生成标签
        id: tag
        run: echo "tag=v$(TZ=Asia/Shanghai date +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 删除旧的预发布
        if: inputs.release-type == 'prerelease'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: 发布
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [[ "$RELEASE_TYPE" == "prerelease" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*
          {
            echo "### $TAG"
            echo "- 类型：$RELEASE_TYPE"
            echo "- 架构：linux x86_64 / aarch64"
          } >> "$GITHUB_STEP_SUMMARY"
