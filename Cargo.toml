[package]
name = "dsh-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "单二进制远程执行网关：DSH MCP 服务端、公网中继、被控端"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.23"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
hkdf = "0.13"
hex = "0.4"
hostname = "0.4"
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = { version = "0.10", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
ruzstd = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
