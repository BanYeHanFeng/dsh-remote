[package]
name = "dsh-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.13"
hostname = "0.4"
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yamux = "0.14"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
